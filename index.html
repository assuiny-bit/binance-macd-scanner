
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幣安日K MACD 背離掃描器</title>
<style>
body{margin:0;padding:20px;background:#111827;color:#e5e7eb;font-family:Arial,sans-serif}
main{max-width:1100px;margin:auto}
h1{font-size:24px}
button{padding:12px 18px;border:0;border-radius:8px;background:#f0b90b;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#status{margin:16px 0;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
th,td{padding:10px;border-bottom:1px solid #374151;text-align:left;white-space:nowrap}
th{color:#f0b90b}
.up{color:#34d399}
.down{color:#fb7185}
.wrap{overflow-x:auto}
small{color:#9ca3af}
</style>
</head>
<body>
<main>
<h1>幣安日K MACD 背離掃描器</h1>
<p>掃描 USDT 本位永續合約｜只使用已收盤日K</p>
<button id="scan">開始掃描</button>
<div id="status">尚未開始</div>
<div class="wrap">
<table>
<thead>
<tr>
<th>幣種</th><th>訊號</th><th>轉折日期</th>
<th>價格變化</th><th>DIF 變化</th><th>RSI(14)</th>
</tr>
</thead>
<tbody id="results"></tbody>
</table>
</div>
<small>公開行情、無交易功能。訊號僅供參考；網路或交易所限流可能影響掃描結果。</small>
</main>

<script>
const API = "https://fapi.binance.com";
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

function ema(a, n) {
  const out = Array(a.length).fill(null);
  if (a.length < n) return out;

  let v = a.slice(0, n).reduce((x, y) => x + y, 0) / n;
  out[n - 1] = v;
  const k = 2 / (n + 1);

  for (let i = n; i < a.length; i++) {
    v = a[i] * k + v * (1 - k);
    out[i] = v;
  }
  return out;
}

function rsi(a, n = 14) {
  const out = Array(a.length).fill(null);
  if (a.length <= n) return out;

  let gain = 0, loss = 0;

  for (let i = 1; i <= n; i++) {
    const d = a[i] - a[i - 1];
    if (d > 0) gain += d;
    else loss -= d;
  }

  let ag = gain / n, al = loss / n;
  out[n] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);

  for (let i = n + 1; i < a.length; i++) {
    const d = a[i] - a[i - 1];
    ag = (ag * (n - 1) + Math.max(d, 0)) / n;
    al = (al * (n - 1) + Math.max(-d, 0)) / n;
    out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  }
  return out;
}

function pivots(a, kind, left = 2, right = 2) {
  const out = [];

  for (let i = left; i < a.length - right; i++) {
    if (a[i] === null || !Number.isFinite(a[i])) continue;

    const w = a.slice(i - left, i + right + 1);
    if (w.some(v => v === null || !Number.isFinite(v))) continue;

    if (kind === "high" &&
        a[i] === Math.max(...w) &&
        w.filter(v => v === a[i]).length === 1) {
      out.push(i);
    }

    if (kind === "low" &&
        a[i] === Math.min(...w) &&
        w.filter(v => v === a[i]).length === 1) {
      out.push(i);
    }
  }
  return out;
}

/*
 * 價格轉折配對 DIF 轉折：
 * 1. 只接受日期差距在 ±2 根日K內的 DIF 轉折。
 * 2. 每個價格轉折選擇日期最近的 DIF 轉折。
 * 3. 同一個 DIF 轉折不能被重複使用。
 * 4. 最後按價格轉折日期排序。
 */
function pairPivots(pricePivots, difPivots) {
  const candidates = [];

  for (const p of pricePivots) {
    for (const d of difPivots) {
      const distance = Math.abs(p - d);
      if (distance <= 2) {
        candidates.push({p, d, distance});
      }
    }
  }

  candidates.sort((a, b) =>
    a.distance - b.distance || a.p - b.p || a.d - b.d
  );

  const usedPrice = new Set();
  const usedDif = new Set();
  const pairs = [];

  for (const item of candidates) {
    if (usedPrice.has(item.p) || usedDif.has(item.d)) continue;

    usedPrice.add(item.p);
    usedDif.add(item.d);
    pairs.push([item.p, item.d]);
  }

  pairs.sort((a, b) => a[0] - b[0]);
  return pairs;
}

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw Error("HTTP " + res.status);
  return res.json();
}

async function scanSymbol(symbol) {
  const raw = await getJSON(
    `${API}/fapi/v1/klines?symbol=${symbol}&interval=1d&limit=240`
  );

  const now = Date.now();

  // Binance K線第7欄是收盤時間；只採用已收盤K線。
  const candles = raw.filter(x => Number(x[6]) < now);
  if (candles.length < 80) return [];

  const close = candles.map(x => Number(x[4]));
  const high = candles.map(x => Number(x[2]));
  const low = candles.map(x => Number(x[3]));
  const dates = candles.map(x =>
    new Date(Number(x[0])).toISOString().slice(0, 10)
  );

  const fast = ema(close, 12);
  const slowEma = ema(close, 26);

  const dif = close.map((_, i) =>
    fast[i] === null || slowEma[i] === null
      ? null
      : fast[i] - slowEma[i]
  );

  const firstDif = dif.findIndex(v => v !== null);
  const deaTail = ema(dif.slice(firstDif), 9);
  const dea = Array(firstDif).fill(null).concat(deaTail);
  const rsiValues = rsi(close, 14);
  const found = [];

  for (const kind of ["high", "low"]) {
    const prices = kind === "high" ? high : low;

    const pricePivots = pivots(prices, kind, 2, 2);
    const difPivots = pivots(dif, kind, 2, 2);
    const pairs = pairPivots(pricePivots, difPivots);

    for (let j = pairs.length - 1; j > 0; j--) {
      const [p1, d1] = pairs[j - 1];
      const [p2, d2] = pairs[j];
      const gap = p2 - p1;

      if (gap < 5 || gap > 60) continue;

      let valid = false;
      let invalid = false;
      let signal = "";

      if (kind === "high") {
        // 頂背離：價格創高，DIF 高點降低，兩個 DIF 高點都在零軸上方。
        valid =
          high[p2] > high[p1] &&
          dif[d2] < dif[d1] &&
          dif[d1] > 0 &&
          dif[d2] > 0;

        signal = "MACD頂背離";

        // 第二個價格轉折之後，DIF 與 DEA 都曾到達或穿越零軸。
        // 兩者不需要在同一根K線發生。
        invalid =
          dif.slice(p2 + 1).some(v => v !== null && v <= 0) &&
          dea.slice(p2 + 1).some(v => v !== null && v <= 0);
      } else {
        // 底背離：價格創低，DIF 低點抬高，兩個 DIF 低點都在零軸下方。
        valid =
          low[p2] < low[p1] &&
          dif[d2] > dif[d1] &&
          dif[d1] < 0 &&
          dif[d2] < 0;

        signal = "MACD底背離";

        invalid =
          dif.slice(p2 + 1).some(v => v !== null && v >= 0) &&
          dea.slice(p2 + 1).some(v => v !== null && v >= 0);
      }

      if (valid && !invalid) {
        found.push({
          symbol,
          signal,
          date1: dates[p1],
          date2: dates[p2],
          price1: prices[p1],
          price2: prices[p2],
          dif1: dif[d1],
          dif2: dif[d2],
          rsi: rsiValues[p2]
        });

        // 每個方向只保留最近找到的一組候選訊號。
        break;
      }
    }
  }

  return found;
}

$("scan").onclick = async () => {
  const button = $("scan");
  button.disabled = true;
  $("results").innerHTML = "";

  const found = [];
  let errors = 0;

  try {
    $("status").textContent = "正在取得合約清單……";

    const info = await getJSON(API + "/fapi/v1/exchangeInfo");

    const symbols = info.symbols
      .filter(s =>
        s.status === "TRADING" &&
        s.contractType === "PERPETUAL" &&
        s.quoteAsset === "USDT"
      )
      .map(s => s.symbol);

    for (let i = 0; i < symbols.length; i++) {
      $("status").textContent =
        `掃描中：${i + 1}/${symbols.length}\n` +
        `候選訊號：${found.length}\n` +
        `失敗合約：${errors}`;

      try {
        found.push(...await scanSymbol(symbols[i]));
      } catch (e) {
        errors++;
        console.warn("掃描失敗：", symbols[i], e);
      }

      // 降低請求頻率，減少觸發限流的機會。
      if (i % 5 === 4) await sleep(250);
    }

    found.sort((a, b) => b.date2.localeCompare(a.date2));

    for (const x of found) {
      const tr = document.createElement("tr");

      const values = [
        x.symbol,
        x.signal,
        `${x.date1} → ${x.date2}`,
        `${x.price1} → ${x.price2}`,
        `${x.dif1.toFixed(6)} → ${x.dif2.toFixed(6)}`,
        x.rsi === null
          ? "—"
          : x.rsi.toFixed(1) +
            (x.rsi >= 80 ? "（超買）" :
             x.rsi <= 20 ? "（超賣）" : "")
      ];

      values.forEach((value, i) => {
        const td = document.createElement("td");
        td.textContent = value;

        if (i === 1) {
          td.className = x.signal.includes("頂") ? "down" : "up";
        }

        tr.appendChild(td);
      });

      $("results").appendChild(tr);
    }

    $("status").textContent =
      `掃描完成。合約數：${symbols.length}；` +
      `候選訊號：${found.length}；失敗合約：${errors}`;

  } catch (e) {
    $("status").textContent =
      "掃描中止：" + e.message +
      "\n請稍後重試，或檢查瀏覽器是否允許連線幣安。";
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
</html>
