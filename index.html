<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>幣安 MACD 掃描器</title>
  <style>
    body {
      background: #111827;
      color: #f9fafb;
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    button {
      padding: 12px 20px;
      cursor: pointer;
      background: #f0b90b;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
    }
    #result {
      margin-top: 20px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h1>幣安 MACD 掃描器</h1>
  <p>第一步：測試幣安公開行情連線</p>
  <button id="test">測試連線</button>
  <div id="result">等待測試……</div>

  <script>
    document.getElementById("test").addEventListener("click", async () => {
      const result = document.getElementById("result");
      result.textContent = "正在測試連線……";

      try {
        const response = await fetch(
          "https://fapi.binance.com/fapi/v1/exchangeInfo"
        );

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        const count = data.symbols.filter(
          s => s.status === "TRADING" &&
               s.contractType === "PERPETUAL" &&
               s.quoteAsset === "USDT"
        ).length;

        result.textContent =
          "連線成功！\nUSDT 本位永續合約數量：" + count;
      } catch (error) {
        result.textContent =
          "連線失敗：" + error.message +
          "\n可能是網域限制或瀏覽器跨來源存取限制。";
      }
    });
  </script>
</body>
</html>
