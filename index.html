<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幣安日K MACD 背離掃描器</title>
<style>
body{margin:0;padding:20px;background:#111827;color:#e5e7eb;font-family:Arial,sans-serif}
main{max-width:1100px;margin:auto}
h1{font-size:24px}
button{padding:12px 18px;border:0;border-radius:8px;background:#f0b90b;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#status{margin:16px 0;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
th,td{padding:10px;border-bottom:1px solid #374151;text-align:left}
th{color:#f0b90b}
.up{color:#34d399}
.down{color:#fb7185}
.wrap{overflow-x:auto}
small{color:#9ca3af}
</style>
</head>
<body>
<main>
<h1>幣安日K MACD 背離掃描器</h1>
<p>掃描 USDT 本位永續合約｜只使用已收盤日K</p>

<button id="scan">開始掃描</button>
<div id="status">尚未開始</div>

<div class="wrap">
<table>
<thead>
<tr>
<th>幣種</th>
<th>訊號</th>
<th>轉折日期</th>
<th>價格變化</th>
<th>DIF 變化</th>
<th>RSI(14)</th>
</tr>
</thead>
<tbody id="results"></tbody>
</table>
</div>

<small>公開行情、無交易功能。請求可能受幣安限流影響，訊號僅供參考。</small>
</main>

<script>
const API = "https://fapi.binance.com";
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

function ema(a, n) {
  const out = Array(a.length).fill(null);
  if (a.length < n) return out;

  let v = a.slice(0, n).reduce((x, y) => x + y, 0) / n;
  out[n - 1] = v;

  const k = 2 / (n + 1);

  for (let i = n; i < a.length; i++) {
    v = a[i] * k + v * (1 - k);
    out[i] = v;
  }

  return out;
}

function rsi(a, n = 14) {
  const out = Array(a.length).fill(null);
  if (a.length <= n) return out;

  let gain = 0;
  let loss = 0;

  for (let i = 1; i <= n; i++) {
    const d = a[i] - a[i - 1];

    if (d > 0) gain += d;
    else loss -= d;
  }

  let ag = gain / n;
  let al = loss / n;

  out[n] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);

  for (let i = n + 1; i < a.length; i++) {
    const d = a[i] - a[i - 1];

    ag = (ag * (n - 1) + Math.max(d, 0)) / n;
    al = (al * (n - 1) + Math.max(-d, 0)) / n;

    out[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  }

  return out;
}

function pivots(a, kind, left = 2, right = 2) {
  const out = [];

  for (let i = left; i < a.length - right; i++) {
    if (a[i] === null) continue;

    const w = a.slice(i - left, i + right + 1);
    if (w.some(v => v === null)) continue;

    if (
      kind === "high" &&
      a[i] === Math.max(...w) &&
      w.filter(v => v === a[i]).length === 1
    ) {
      out.push(i);
    }

    if (
      kind === "low" &&
      a[i] === Math.min(...w) &&
      w.filter(v => v === a[i]).length === 1
    ) {
      out.push(i);
    }
  }

  return out;
}

async function getJSON(url) {
  const res = await fetch(url);

  if (!res.ok) {
    throw Error("HTTP " + res.status);
  }

  return res.json();
}

async function scanSymbol(symbol) {
  const raw = await getJSON(
    `${API}/fapi/v1/klines?symbol=${symbol}&interval=1d&limit=240`
  );

  const now = Date.now();

  // 只保留已收盤的日K
  const c = raw.filter(x => Number(x[6]) < now);

  if (c.length < 80) return [];

  const close = c.map(x => +x[4]);
  const high = c.map(x => +x[2]);
  const low = c.map(x => +x[3]);
  const date = c.map(x =>
    new Date(+x[0]).toISOString().slice(0, 10)
  );

  const f = ema(close, 12);
  const s = ema(close, 26);

  const dif = close.map((_, i) =>
    f[i] === null || s[i] === null
      ? null
      : f[i] - s[i]
  );

  const first = dif.findIndex(v => v !== null);
  const dt = ema(dif.slice(first), 9);
  const dea = Array(first).fill(null).concat(dt);

  const rv = rsi(close);
  const out = [];

  for (const kind of ["high", "low"]) {
    const prices = kind === "high" ? high : low;

    const pp = pivots(prices, kind);
    const dp = pivots(dif, kind);
    const pairs = [];

    for (const p of pp) {
      const matches = dp.filter(d => Math.abs(d - p) <= 2);

      if (matches.length) {
        const d = matches.sort(
          (a, b) => Math.abs(a - p) - Math.abs(b - p)
        )[0];

        if (!pairs.some(x => x[1] === d)) {
          pairs.push([p, d]);
        }
      }
    }

    pairs.sort((a, b) => a[0] - b[0]);

    for (let j = pairs.length - 1; j > 0; j--) {
      const [p1, d1] = pairs[j - 1];
      const [p2, d2] = pairs[j];
      const gap = p2 - p1;

      if (gap < 5 || gap > 60) continue;

      let valid;
      let signal;
      let invalid;

      if (kind === "high") {
        // 頂背離：價格高點更高，DIF 高點更低，DIF 均在零軸上方
        valid =
          high[p2] > high[p1] &&
          dif[d2] < dif[d1] &&
          dif[d1] > 0 &&
          dif[d2] > 0;

        signal = "MACD頂背離";

        // 第二個轉折後，DIF 與 DEA 都曾觸及或穿越零軸
        invalid =
          dif.slice(p2 + 1).some(v => v !== null && v <= 0) &&
          dea.slice(p2 + 1).some(v => v !== null && v <= 0);
      } else {
        // 底背離：價格低點更低，DIF 低點更高，DIF 均在零軸下方
        valid =
          low[p2] < low[p1] &&
          dif[d2] > dif[d1] &&
          dif[d1] < 0 &&
          dif[d2] < 0;

        signal = "MACD底背離";

        invalid =
          dif.slice(p2 + 1).some(v => v !== null && v >= 0) &&
          dea.slice(p2 + 1).some(v => v !== null && v >= 0);
      }

      if (valid && !invalid) {
        out.push({
          symbol,
          signal,
          date1: date[p1],
          date2: date[p2],
          price1: prices[p1],
          price2: prices[p2],
          dif1: dif[d1],
          dif2: dif[d2],
          rsi: rv[p2]
        });

        break;
      }
    }
  }

  return out;
}

$("scan").onclick = async () => {
  $("scan").disabled = true;
  $("results").innerHTML = "";

  const found = [];

  try {
    $("status").textContent = "正在取得合約清單……";

    const info = await getJSON(API + "/fapi/v1/exchangeInfo");

    const symbols = info.symbols
      .filter(s =>
        s.status === "TRADING" &&
        s.contractType === "PERPETUAL" &&
        s.quoteAsset === "USDT"
      )
      .map(s => s.symbol);

    let completed = 0;
    let errors = 0;

    for (let i = 0; i < symbols.length; i++) {
      $("status").textContent =
        `掃描中：${i + 1}/${symbols.length}\n` +
        `已找到候選訊號：${found.length}\n` +
        `失敗合約：${errors}`;

      try {
        found.push(...await scanSymbol(symbols[i]));
      } catch (e) {
        errors++;
        console.warn(symbols[i], e);
      }

      completed++;

      if (i % 5 === 4) {
        await sleep(250);
      }
    }

    found.sort((a, b) => b.date2.localeCompare(a.date2));

    for (const x of found) {
      const tr = document.createElement("tr");

      const vals = [
        x.symbol,
        x.signal,
        `${x.date1} → ${x.date2}`,
        `${x.price1} → ${x.price2}`,
        `${x.dif1.toFixed(6)} → ${x.dif2.toFixed(6)}`,
        x.rsi === null
          ? "—"
          : x.rsi.toFixed(1) +
            (x.rsi >= 80
              ? "（超買）"
              : x.rsi <= 20
                ? "（超賣）"
                : "")
      ];

      // 修正表格欄位顯示
      vals.forEach((v, i) => {
        const td = document.createElement("td");
        td.textContent = v;

        if (i === 1) {
          td.className = x.signal.includes("頂") ? "down" : "up";
        }

        tr.appendChild(td);
      });

      $("results").appendChild(tr);
    }

    $("status").textContent =
      `掃描完成。合約數：${symbols.length}；` +
      `候選訊號：${found.length}；` +
      `失敗合約：${errors}`;

  } catch (e) {
    $("status").textContent =
      "掃描中止：" + e.message +
      "\n請稍後重試，或檢查瀏覽器是否允許連線幣安。";
  } finally {
    $("scan").disabled = false;
  }
};
</script>
</body>
</html>
